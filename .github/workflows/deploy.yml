name: Build and Push to ACR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/rag-chatbot:${{ github.sha }} -t ${{ secrets.ACR_NAME }}.azurecr.io/rag-chatbot:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.ACR_NAME }}.azurecr.io/rag-chatbot:${{ github.sha }} && docker push ${{ secrets.ACR_NAME }}.azurecr.io/rag-chatbot:latest

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name rag-chatbot-app \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/rag-chatbot:latest
